{% extends 'accounts/base.html' %}
{% block title %}Create Agent{% endblock %}

{% block content %}
  <h2 class="mb-4">Create Agent</h2>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    {% load static %}
    <link href="{% static 'accounts/agent.css' %}?v=2" rel="stylesheet">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'admin_dashboard' %}" class="btn btn-back">Go Back</a>
  </form>
{% endblock %}
