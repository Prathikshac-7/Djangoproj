{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Dashboard{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'accounts/dashboard.css' %}" rel="stylesheet">
 

</head>

<body>
  <script src="{% static 'accounts/open_tickets.js' %}"></script>
<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand">Ticketing System</span>
    <div class="text-white d-flex align-items-center">
      <i class="bi bi-person-circle fs-4 me-2"></i>
      {{ request.user.first_name }}
    </div>
  </div>
</nav>

<!-- Layout -->
<div class="d-flex">
  <!-- Sidebar -->
  <div class="sidebar bg-primary text-white p-3">
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link text-white" href="{% url 'customer_dashboard' %}">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="{% url 'open_tickets' %}">Open Tickets</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="{% url 'logout' %}">Logout</a></li>
    </ul>
  </div>

  <!-- Dynamic Content -->
  <div class="content p-4 flex-fill">
    {% block content %}
    {% endblock %}
  </div>
</div>

</body>
</html>
